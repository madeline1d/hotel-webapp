<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Staff — Order Management</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🏨%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="staff">
  <header class="topbar">
    <div class="brand">
      <h1 id="staff-biz-name">Staff</h1>
      <p>Staff Order Management</p>
    </div>
    <nav class="nav">
      <a href="index.html">Customer Page</a>
      <button id="logout-btn" class="cart-btn hidden">Logout</button>
    </nav>
  </header>

  <!-- Locked login screen (shown first) -->
  <section id="login-screen" class="login-wrap">
    <form id="login-form" class="panel login-card" autocomplete="off">
      <h2>Staff Login</h2>
      <p class="muted">Enter the staff PIN to view orders.</p>
      <label>PIN
        <input id="pin-input" type="password" inputmode="numeric" maxlength="8" required>
      </label>
      <p id="login-error" class="error hidden">Incorrect PIN</p>
      <button type="submit" class="btn primary block">Unlock</button>
    </form>
  </section>

  <!-- Order board (hidden and empty until login) -->
  <main id="board-screen" class="hidden board-main">
    <div class="board-toolbar">
      <input id="board-search" type="search" placeholder="Search order no., name or phone">
      <button id="refresh-btn" class="btn">Refresh</button>
    </div>
    <div id="board" class="board"></div>
  </main>

  <script src="content.js"></script>
  <script src="script.js"></script>
  <script src="staff.js"></script>
</body>
</html>
